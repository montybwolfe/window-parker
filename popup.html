<!doctype html>
<html lang="en" class="popup-root"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Window Parker</title><link rel="icon" href="icons/window-parker-32.png"><script src="theme.js"></script><link rel="stylesheet" href="ui.css"><script type="module" src="popup.js"></script></head>
<body class="popup"><header class="app-header"><img src="icons/window-parker.svg" width="16" height="16" alt=""><h1>Window Parker</h1></header>
<main>
<section class="this-tab" id="thisTab" aria-label="This tab">
<p class="tab-line"><img id="tabIcon" width="16" height="16" alt=""><span id="tabTitle" dir="auto"></span></p>
<button id="protect" type="button" title="Protection lasts until Chrome closes." disabled><span id="protectLabel">Protect this tab</span></button>
<p class="note" id="protectNote" hidden>Only web pages can be protected.</p>
</section>
<dl class="stats" id="stats"><div><dt>Parked windows</dt><dd id="parkedCount">—</dd></div><div><dt>Sleeping tabs</dt><dd id="sleepingCount">—</dd></div></dl>
<p class="note stats-help">Includes tabs put to sleep by Chrome.</p>
<div class="mode-row"><p id="mode">Checking status…</p><button id="toggle" type="button" disabled><span id="toggleLabel">Pause automatic parking</span></button></div>
<details class="clearing" id="clearing"><summary>Clear and reset tab actions</summary>
<div class="clearing-actions" id="clearingActions"><button class="danger" id="closeParked" type="button" disabled>Clear parked tabs</button><button class="danger" id="clearProtected" type="button" disabled>Clear protected tabs</button></div>
<div class="confirm" id="confirm" role="group" aria-labelledby="confirmTitle" aria-describedby="confirmText" hidden><p class="confirm-title" id="confirmTitle"></p><p id="confirmText"></p>
<label class="check-row"><input type="checkbox" id="confirmSkip"><span>Don’t show this warning again</span></label>
<div class="confirm-buttons"><button class="default" id="confirmCancel" type="button">Cancel</button><button class="danger" id="confirmGo" type="button"></button></div></div>
</details>
<p id="status" role="status" aria-live="polite"></p>
</main>
<footer class="popup-footer"><button class="link" id="changelog" type="button" aria-label="Changelog (opens in a new tab)" title="Release notes on GitHub">Changelog</button><div class="tools"><button class="icon-button" id="reportBug" type="button" aria-label="Report a bug on GitHub (opens in a new tab)" title="Report a bug"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7.4a3 3 0 0 1 6 0"/><path d="M8 9h8a1 1 0 0 1 1 1v4a5 5 0 0 1-10 0v-4a1 1 0 0 1 1-1Z"/><path d="M12 12v7M7 12.5H4M17 12.5h3M7.5 16.5 5 18.5M16.5 16.5l2.5 2M7.4 10 5 8M16.6 10 19 8M10.2 4.6 9.2 3.2M13.8 4.6l1-1.4"/></svg></button><button class="icon-button" id="support" type="button" aria-label="Buy me a coffee (opens in a new tab)" title="Buy me a coffee"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10h11.5v4.25A5.75 5.75 0 0 1 10.25 20h0A5.75 5.75 0 0 1 4.5 14.25Z"/><path d="M16 11.5h1.25a2.75 2.75 0 0 1 0 5.5H16"/><path d="M8 6.5c.7-.6.7-1.4 0-2M11.75 6.5c.7-.6.7-1.4 0-2"/></svg></button><button class="icon-button" id="options" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.54 5.15L10.79 2.78A9.3 9.3 0 0 1 13.21 2.78L13.46 5.15A7 7 0 0 1 15.81 6.13L15.81 6.13L17.66 4.62A9.3 9.3 0 0 1 19.38 6.34L17.87 8.19A7 7 0 0 1 18.85 10.54L18.85 10.54L21.22 10.79A9.3 9.3 0 0 1 21.22 13.21L18.85 13.46A7 7 0 0 1 17.87 15.81L17.87 15.81L19.38 17.66A9.3 9.3 0 0 1 17.66 19.38L15.81 17.87A7 7 0 0 1 13.46 18.85L13.46 18.85L13.21 21.22A9.3 9.3 0 0 1 10.79 21.22L10.54 18.85A7 7 0 0 1 8.19 17.87L8.19 17.87L6.34 19.38A9.3 9.3 0 0 1 4.62 17.66L6.13 15.81A7 7 0 0 1 5.15 13.46L5.15 13.46L2.78 13.21A9.3 9.3 0 0 1 2.78 10.79L5.15 10.54A7 7 0 0 1 6.13 8.19L6.13 8.19L4.62 6.34A9.3 9.3 0 0 1 6.34 4.62L8.19 6.13A7 7 0 0 1 10.54 5.15Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></footer>
</body></html>
