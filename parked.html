<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parked</title><link rel="icon" href="icons/window-parker-32.png"><script src="theme.js"></script><link rel="stylesheet" href="ui.css"><script type="module" src="parked.js"></script></head>
<body class="parking-body"><main class="parked">
<h1 class="previous-title"><img class="favicon" id="favicon" alt="" width="32" height="32" hidden><span id="previous" dir="auto">Your previous tab</span></h1>
<p id="previousHost"></p>
<p class="parked-state">This window is parked.</p>
<p id="detail"><span id="detailTabs">Loading window details…</span> <span id="detailReturn"></span></p>
<div class="parked-actions"><button class="default" id="restore" type="button">Restore tab</button></div>
<p id="status" role="status" aria-live="polite"></p>
</main>
<footer class="parked-brand"><img src="icons/window-parker.svg" width="16" height="16" alt="">Window Parker</footer>
</body></html>
