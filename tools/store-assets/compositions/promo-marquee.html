<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
.brand { position: absolute; left: 112px; top: 50%; transform: translateY(-50%); }
.mark { width: 104px; height: 104px; margin-bottom: 28px; }
.name { font-size: 58px; }
/* The right end of screenshot 2 (x 740 to 1272), pixel for pixel: the real popup over its Chrome window.
   It stops just inside the window's rounded corner, so the menu button is whole and no white corner shows. */
.shot { position: absolute; left: 768px; top: 75px; width: 532px; height: 410px; overflow: hidden; border-radius: 10px; outline: 1px solid var(--line); }
.shot img { display: block; width: 1280px; margin-left: -740px; image-rendering: pixelated; }
</style></head>
<body>
<div class="brand"><img class="mark" src="../../../icons/window-parker.svg" alt=""><div class="name">Window Parker</div></div>
<div class="shot"><img src="../../../store-listing/screenshot-2-popup-1280x800.png" alt=""></div>
</body></html>
