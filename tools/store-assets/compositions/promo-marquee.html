<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
.brand { position: absolute; left: 112px; top: 50%; transform: translateY(-50%); }
.mark { width: 104px; height: 104px; margin-bottom: 28px; }
.name { font-size: 58px; } .line { margin-top: 14px; font-size: 26px; line-height: 34px; }
.window { left: 740px; top: 50%; transform: translateY(-50%); width: 560px; }
.window .bar { position: relative; height: 30px; background: #e7eaef; }
.window .bar i { position: absolute; top: 11px; width: 9px; height: 9px; border-radius: 50%; background: #ff5f57; }
.window .bar i:nth-child(1) { left: 12px; } .window .bar i:nth-child(2) { left: 26px; background: #febc2e; } .window .bar i:nth-child(3) { left: 40px; background: #28c840; }
.window img { display: block; width: 560px; }
</style></head>
<body>
<div class="brand"><img class="mark" src="../../../icons/window-parker.svg" alt="">
<div class="name">Window Parker</div><div class="line">Let idle windows rest.</div></div>
<div class="window"><div class="bar"><i></i><i></i><i></i></div><img src="../../../store-listing/sources/ui/parked-light.png" alt=""></div>
</body></html>
